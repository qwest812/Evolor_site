# Сайт за nginx магазина (контейнер erbology_nginx, сеть erb-network).
# Домен и SSL — на nginx: deploy/nginx/*.conf, сертификат — deploy/ssl.sh.
services:
  site:
    build: .
    container_name: evolor-site
    restart: always
    environment:
      # :80 — Caddy отдаёт обычный HTTP, наружу не публикуется
      - SITE_DOMAIN=:80
    volumes:
      # Файлы проверки Let's Encrypt (их кладёт certbot из deploy/ssl.sh)
      - ./certbot/www:/srv/.well-known/acme-challenge:ro
    networks:
      - erb-network

networks:
  erb-network:
    external: true
