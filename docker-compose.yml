# Сайт за nginx магазина (контейнер erbology_nginx, сеть erb-network).
# Домен и SSL — на nginx: deploy/nginx/*.conf, сертификат — deploy/ssl.sh.
services:
  site:
    build: .
    container_name: evolor-site
    restart: always
    environment:
      # :80 — Caddy отдаёт обычный HTTP, наружу не публикуется
      - SITE_DOMAIN=:80
    volumes:
      # Файлы проверки Let's Encrypt (их кладёт certbot из deploy/ssl.sh)
      - ./certbot/www:/acme:ro
    networks:
      - erb-network

networks:
  erb-network:
    # Реальное имя сети nginx магазина (часто с префиксом проекта) — в .env:
    # ERB_NETWORK=$(docker inspect -f '{{range $k, $v := .NetworkSettings.Networks}}{{$k}} {{end}}' erbology_nginx)
    name: ${ERB_NETWORK:-erb-network}
    external: true
