# Сайт Evolor за nginx магазина (контейнер erbology_nginx, сеть erb-network).
# Кладётся в conf.d nginx магазина. Сертификат Let's Encrypt выпускает и продлевает deploy/ssl.sh.
server {
    listen 80;
    listen [::]:80;
    server_name evolor.tagumplay.com;

    # Адрес через переменную: nginx ищет контейнер при запросе, а не при старте.
    # Иначе остановленный сайт не дал бы запуститься nginx всего магазина.
    resolver 127.0.0.11 valid=30s;
    set $evolor http://evolor-site:80;

    # Проверка домена Let's Encrypt при продлении
    location /.well-known/acme-challenge/ {
        proxy_pass $evolor;
        proxy_set_header Host $host;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name evolor.tagumplay.com;

    ssl_certificate     /etc/nginx/certs/evolor.tagumplay.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/evolor.tagumplay.com/privkey.pem;

    access_log /var/log/nginx/access-evolor.tagumplay.com.log;
    error_log  /var/log/nginx/error-evolor.tagumplay.com.log;

    resolver 127.0.0.11 valid=30s;
    set $evolor http://evolor-site:80;

    location / {
        proxy_pass $evolor;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
