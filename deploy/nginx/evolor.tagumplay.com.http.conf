# Временный конфиг: только HTTP, чтобы Let's Encrypt проверил домен.
# После выпуска сертификата deploy/ssl.sh заменяет его на evolor.tagumplay.com.conf.
server {
    listen 80;
    listen [::]:80;
    server_name evolor.tagumplay.com;

    resolver 127.0.0.11 valid=30s;
    set $evolor http://evolor-site:80;

    location / {
        proxy_pass $evolor;
        proxy_set_header Host $host;
    }
}
